                    e.x = Math.max(margin.x, Math.min(canvas.width - margin.x, e.x));
                    e.y = Math.max(margin.y + 16, Math.min(canvas.height - 72 - margin.y, e.y));
                }
            });

            for (let i = damageNumbers.length - 1; i >= 0; i--) {
                damageNumbers[i].y -= 0.7;
                damageNumbers[i].timer--;
                if (damageNumbers[i].timer <= 0) damageNumbers.splice(i, 1);
            }
            if (damageNumbers.length > 35) damageNumbers.splice(0, damageNumbers.length - 35);

            frameCount++;
        }

        function triggerShout(s) {
            shotsFired++;
            if (shotsFired % 7 === 0 || s === 'ultimate') {
                player.shoutTimer = 140;
                if (s === 'americano') player.shoutText = "看我的美式咖啡！";
                else if (s === 'latte') player.shoutText = "來杯溫潤的拿鐵！";
                else if (s === 'coldBrew') player.shoutText = "巨冰急凍降溫！";
                else if (s === 'aeropress') player.shoutText = "感受愛樂壓的高壓！";
                else if (s === 'ultimate') player.shoutText = "終極拉花！全場淨空！";
            }
        }

        // === 10. 繪圖系統 ===
        function drawBackground() {
            ctx.fillStyle = '#1d2a35';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gridSize = 56;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.045)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
            for (let y = 0; y <= canvas.height; y += gridSize) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
            ctx.stroke();

            const vignette = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.28,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.72
            );
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(6, 10, 15, 0.55)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawPowerOrbs() {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            powerOrbs.forEach(orb => {
                const meta = ORB_META[orb.type];
                const isUlt = orb.type === 'ultimate';
                const bobY = Math.sin(frameCount * 0.1 + orb.bobPhase) * 4;
                const y = orb.y + bobY;
                const timeRatio = Math.max(0, orb.timer / orb.maxTimer);

                // 最後 3 秒急促閃爍提示
                if (orb.timer < 180 && Math.floor(orb.timer / 6) % 2 === 0) return;

                // 外圈光暈
                ctx.beginPath();
                ctx.arc(orb.x, y, orb.radius + (isUlt ? 11 : 7), 0, Math.PI * 2);
                ctx.fillStyle = meta.color;
                ctx.globalAlpha = isUlt ? (0.28 + Math.sin(frameCount * 0.2) * 0.14) : 0.2;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // 本體圓球
                ctx.beginPath();
                ctx.arc(orb.x, y, orb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#15202b';
                ctx.fill();
                ctx.strokeStyle = meta.color;
                ctx.lineWidth = isUlt ? 4 : 3;
                ctx.stroke();

                // 剩餘時間弧線
                ctx.beginPath();
                ctx.arc(orb.x, y, orb.radius + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * timeRatio);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 圖示與標籤
                ctx.font = isUlt ? '22px Arial' : '17px Arial';
                ctx.fillText(meta.icon, orb.x, y + 1);

                ctx.font = 'bold 12px 微軟正黑體';
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillText(meta.label, orb.x + 1, y + orb.radius + 14);
                ctx.fillStyle = isUlt ? '#ffd700' : '#ffffff';
                ctx.fillText(meta.label, orb.x, y + orb.radius + 13);

                // 玩家周圍雷達方向箭頭 (距離大於 160px 時顯示)
                const dist = getDistance(player.x, player.y, orb.x, orb.y);
                if (dist > 165) {
                    const ang = Math.atan2(orb.y - player.y, orb.x - player.x);
                    const indR = isUlt ? 66 : 56;
                    const ix = player.x + Math.cos(ang) * indR;
                    const iy = player.y + Math.sin(ang) * indR;
                    ctx.save();
                    ctx.translate(ix, iy);
                    ctx.rotate(ang);
                    ctx.fillStyle = meta.color;
                    ctx.beginPath();
                    ctx.moveTo(isUlt ? 11 : 8, 0);
                    ctx.lineTo(-5, isUlt ? -7 : -5);
                    ctx.lineTo(-5, isUlt ? 7 : 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        function draw() {
            ctx.save();
            if (screenShake > 0.2) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            drawBackground();

            // 反站樁紅圈轟炸預警
            redZones.forEach(rz => {
                const progress = 1 - rz.timer / rz.maxTimer;
                ctx.beginPath(); ctx.arc(rz.x, rz.y, rz.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(231, 76, 60, 0.14)'; ctx.fill();
                ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.beginPath(); ctx.arc(rz.x, rz.y, rz.radius * progress, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(231, 76, 60, 0.36)'; ctx.fill();
            });

            // 場地領域特效
            enemies.forEach(e => {
                if (e.isBoss && e.bossType === 4) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 380, 0, Math.PI * 2);
                    const grd = ctx.createRadialGradient(e.x, e.y, 180, e.x, e.y, 380);
                    grd.addColorStop(0, 'rgba(46, 204, 113, 0)'); grd.addColorStop(1, 'rgba(46, 204, 113, 0.18)');
                    ctx.fillStyle = grd; ctx.fill(); ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2; ctx.stroke();
                }
                if (e.bossType === 5 && e.hp < e.maxHp) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 150, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(142, 68, 173, ${0.1 + (1 - e.hp / e.maxHp) * 0.35})`; ctx.fill();
                }
                if (e.isBoss && e.bossType === 6) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 145, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(173, 216, 230, 0.1)'; ctx.fill();
                    ctx.strokeStyle = 'rgba(173, 216, 230, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
                }
                if (e.isBoss && e.bossType === 1) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 185, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(231, 76, 60, 0.18)'; ctx.fill();
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.75)'; ctx.lineWidth = 3; ctx.stroke();
                }
                // 衝鋒喪屍蓄力預警線
                if (e.isCharger && e.chargeState === 'windup') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.75)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 6]);
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y);
                    ctx.lineTo(e.x + Math.cos(e.chargeAngle) * 360, e.y + Math.sin(e.chargeAngle) * 360);
                    ctx.stroke();
                    ctx.restore();
                }
            });

            if (player.hasBoss1Skill) {
                ctx.beginPath(); ctx.arc(player.x, player.y, 190, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(241, 196, 15, 0.11)'; ctx.fill();
                ctx.strokeStyle = 'rgba(243, 156, 18, 0.65)'; ctx.lineWidth = 2.5; ctx.stroke();
            }

            trumpWalls.forEach(w => {
                ctx.fillStyle = 'rgba(127, 140, 141, 0.82)'; ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 4; ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            kPillars.forEach(kp => {
                if (kp.timer > 180) {
                    ctx.beginPath(); ctx.arc(kp.x, kp.y, kp.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.28)'; ctx.fill(); ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2; ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.8)'; ctx.fillRect(kp.x - kp.radius, kp.y - kp.radius, kp.radius * 2, kp.radius * 3.5);
                    ctx.fillStyle = '#2ecc71'; ctx.fillRect(kp.x - kp.radius, kp.y - kp.radius, kp.radius * 2, 10);
                }
            });

            cyberTrucks.forEach(ct => {
                if (ct.warningTimer > 0) {
                    ctx.fillStyle = `rgba(231, 76, 60, ${0.22 + Math.sin(frameCount * 0.4) * 0.12})`;
                    ctx.fillRect(0, ct.y - ct.height / 2, canvas.width, ct.height);
                } else {
                    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(ct.x, ct.y - ct.height / 2, ct.width, ct.height);
                    ctx.fillStyle = '#95a5a6';
                    ctx.beginPath();
                    ctx.moveTo(ct.x, ct.y + ct.height / 2); ctx.lineTo(ct.x + ct.width / 2, ct.y - ct.height / 2 - 20); ctx.lineTo(ct.x + ct.width, ct.y + ct.height / 2);
                    ctx.fill();
                }
            });

            starlinks.forEach(sl => {
                ctx.beginPath(); ctx.arc(sl.x, sl.y, sl.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(231, 76, 60, 0.18)'; ctx.fill(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.beginPath(); ctx.arc(sl.x, sl.y, sl.radius * (1 - sl.timer / 88), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(231, 76, 60, 0.45)'; ctx.fill();
            });

            // 冰滴領域
            iceZones.forEach(z => {
                ctx.fillStyle = 'rgba(78, 52, 46, 0.34)'; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(93, 173, 226, 0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.fillStyle = 'rgba(52, 152, 219, 0.14)'; ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.7, 0, Math.PI * 2); ctx.fill();
                ctx.save(); ctx.translate(z.x, z.y);
                ctx.fillStyle = '#8d6e63'; ctx.fillRect(-20, -5, 40, 8); ctx.fillRect(-20, -50, 4, 50); ctx.fillRect(16, -50, 4, 50);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.beginPath(); ctx.arc(0, -13, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#4e342e'; ctx.beginPath(); ctx.arc(0, -10, 7, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // X 死光
            xRays.forEach(xr => {
                ctx.save(); ctx.translate(player.x, player.y);
                const alpha = xr.timer / 55;
                const drawBeam = (rgb, w1, w2, w3) => {
                    ctx.fillStyle = `rgba(${rgb}, ${alpha * 0.25})`;
                    ctx.fillRect(-canvas.width * 2, -w1, canvas.width * 4, w1 * 2); ctx.fillRect(-w1, -canvas.width * 2, w1 * 2, canvas.width * 4);
                    ctx.fillStyle = `rgba(${rgb}, ${alpha * 0.78})`;
                    ctx.fillRect(-canvas.width * 2, -w2, canvas.width * 4, w2 * 2); ctx.fillRect(-w2, -canvas.width * 2, w2 * 2, canvas.width * 4);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillRect(-canvas.width * 2, -w3, canvas.width * 4, w3 * 2); ctx.fillRect(-w3, -canvas.width * 2, w3 * 2, canvas.width * 4);
                };
                if (xr.isRedK) drawBeam('231, 76, 60', 85, 55, 18);
                else { ctx.rotate(Math.PI / 4); drawBeam('0, 255, 255', 75, 45, 14); }
                ctx.restore();
            });

            // 黑洞
            blackHoles.forEach(bh => {
                ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(frameCount * 0.1);
                const color = bh.isPlayer ? '155, 89, 182' : '52, 152, 219';
                ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI * 2); ctx.fillStyle = '#08080c'; ctx.fill();
                ctx.strokeStyle = `rgba(${color}, 0.28)`; ctx.lineWidth = 18; ctx.stroke();
                ctx.strokeStyle = `rgba(${color}, 0.85)`; ctx.lineWidth = 6; ctx.stroke();
                ctx.restore();
            });

            // 大絕拉花特效
            ultimates.forEach(u => {
                ctx.save();
                const alpha = u.timer / u.maxTimer;
                ctx.fillStyle = `rgba(243, 229, 171, ${alpha * 0.25})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(2 + (1 - alpha) * 2.8, 2 + (1 - alpha) * 2.8);
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 60); ctx.quadraticCurveTo(60, 0, 0, -60); ctx.quadraticCurveTo(-60, 0, 0, 60);
                ctx.moveTo(0, 60); ctx.lineTo(0, -50);
                ctx.moveTo(0, 30); ctx.lineTo(30, 0); ctx.moveTo(0, 30); ctx.lineTo(-30, 0);
                ctx.moveTo(0, -10); ctx.lineTo(25, -35); ctx.moveTo(0, -10); ctx.lineTo(-25, -35);
                ctx.stroke();
                ctx.restore();
            });

            ultParticles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            shockwaves.forEach(sw => {
                ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
                ctx.strokeStyle = sw.color; ctx.globalAlpha = Math.max(0, sw.alpha); ctx.lineWidth = 4.5; ctx.stroke();
            });
            ctx.globalAlpha = 1.0;

            explosions.forEach(exp => {
                ctx.save();
                ctx.fillStyle = exp.isRed ? `rgba(231, 76, 60, ${exp.alpha * 0.45})` : `rgba(243, 229, 171, ${exp.alpha * 0.65})`;
                ctx.strokeStyle = exp.isRed ? `rgba(192, 57, 43, ${exp.alpha})` : `rgba(255, 255, 255, ${exp.alpha * 0.85})`;
                ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.currentRadius * 0.8, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.currentRadius, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
            });

            mimicChests.forEach(c => {
                ctx.fillStyle = '#8e44ad'; ctx.fillRect(c.x - c.radius, c.y - c.radius, c.radius * 2, c.radius * 1.5);
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(c.x - c.radius / 4, c.y - c.radius / 4, c.radius / 2, c.radius / 2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(c.timer / 60), c.x, c.y - c.radius - 10);
            });

            zoltraaks.forEach(z => {
                ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(z.angle);
                if (!z.isPlayer) {
                    if (z.timer > 55) {
                        ctx.strokeStyle = z.isPurple ? 'rgba(187, 143, 206, 0.8)' : 'rgba(231, 76, 60, 0.75)';
                        ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
                        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2000, 0); ctx.stroke();
                        ctx.setLineDash([]);
                    } else {
                        ctx.fillStyle = 'rgba(142, 68, 173, 0.85)'; ctx.fillRect(0, -64, 2000, 128);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fillRect(0, -30, 2000, 60);
                    }
                } else {
                    const alpha = z.timer / 55;
                    ctx.fillStyle = `rgba(241, 196, 15, ${alpha * 0.7})`; ctx.fillRect(0, -60, 2000, 120);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`; ctx.fillRect(0, -28, 2000, 56);
                }
                ctx.restore();
            });

            // 繪製地圖強化球與雷達箭頭
            drawPowerOrbs();

            // Boss 彈幕
            bossBullets.forEach(bb => {
                ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.radius, 0, Math.PI * 2);
                ctx.fillStyle = bb.type === 'mimicArrow' ? '#9b59b6' : '#2ecc71';
                ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            });

            // 玩家子彈
            bullets.forEach(b => {
                if (b.type === 'latte') {
                    ctx.fillStyle = '#f3e5ab'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#c89e72'; ctx.lineWidth = 3.5; ctx.stroke();
                    ctx.beginPath(); ctx.arc(b.x + b.radius, b.y, 7, -Math.PI / 2, Math.PI / 2); ctx.stroke();
                } else if (b.type === 'coldBrew' && b.fall) {
                    ctx.fillStyle = 'rgba(173, 216, 230, 0.82)'; ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
                } else if (b.type === 'stolen2') {
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius + 5, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2ecc71'; ctx.fillRect(b.x - b.radius * 0.75, b.y - b.radius * 0.75, b.radius * 1.5, b.radius * 1.5);
                    ctx.strokeStyle = '#d5f5e3'; ctx.lineWidth = 2; ctx.strokeRect(b.x - b.radius * 0.75, b.y - b.radius * 0.75, b.radius * 1.5, b.radius * 1.5);
                } else if (b.type === 'americano') {
                    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle + Math.PI / 2);
                    const w = b.radius * 1.45, h = b.radius * 1.95;
                    ctx.fillStyle = '#f5f5f5';
                    ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2); ctx.lineTo(w / 2 * 0.7, h / 2); ctx.lineTo(-w / 2 * 0.7, h / 2); ctx.fill();
                    ctx.fillStyle = '#c89e72';
                    ctx.beginPath(); ctx.moveTo(-w / 2 * 0.85, -h / 8); ctx.lineTo(w / 2 * 0.85, -h / 8); ctx.lineTo(w / 2 * 0.75, h / 4); ctx.lineTo(-w / 2 * 0.75, h / 4); ctx.fill();
                    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(0, -h / 2, w / 2 + 2, 4, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                } else if (b.type === 'aeropress') {
                    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle + Math.PI / 2);
                    ctx.fillStyle = 'rgba(155, 89, 182, 0.36)'; ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#bb8fce'; ctx.lineWidth = 4.5; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.beginPath(); ctx.arc(-b.radius * 0.3, -b.radius * 0.3, b.radius * 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            });

            // 濾杯星環
            if (player.hasStarRing) {
                ctx.save(); ctx.translate(player.x, player.y);
                ctx.beginPath(); ctx.arc(0, 0, 108, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(230, 126, 34, 0.7)'; ctx.lineWidth = 4; ctx.stroke();
                ctx.restore();
                for (let i = 0; i < 5; i++) {
                    const a = player.starRingAngle + (Math.PI * 2 / 5) * i;
                    const cx = player.x + Math.cos(a) * 108, cy = player.y + Math.sin(a) * 108;
                    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a + Math.PI / 2);
                    ctx.fillStyle = '#d35400'; ctx.beginPath(); ctx.moveTo(-17, -13); ctx.lineTo(17, -13); ctx.lineTo(12, 17); ctx.lineTo(-12, 17); ctx.fill();
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.moveTo(-11, -13); ctx.lineTo(11, -13); ctx.lineTo(7, 11); ctx.lineTo(-7, 11); ctx.fill();
                    ctx.restore();
                }
            }

            twitterBirds.forEach(tb => {
                ctx.beginPath(); ctx.arc(tb.x, tb.y, tb.radius, 0, Math.PI * 2); ctx.fillStyle = '#1DA1F2'; ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('𝕏', tb.x, tb.y);
            });

            // 敵人繪製
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const regularEnemies = enemies.filter(e => !e.isBoss && !e.isMiniBoss);
            const miniBossEnemies = enemies.filter(e => e.isMiniBoss);
            const bossEnemies = enemies.filter(e => e.isBoss);

            const renderEnemy = (e) => {
                if (e.isGoblin) {
                    ctx.beginPath(); ctx.arc(e.x, e.y - 8, e.size * 1.45, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(241, 196, 15, 0.35)'; ctx.fill();
                }
                if (e.isCharger) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.size + 8, 0, Math.PI * 2);
                    ctx.fillStyle = e.chargeState === 'dash' ? 'rgba(231, 76, 60, 0.45)' : 'rgba(231, 76, 60, 0.22)';
                    ctx.fill();
                }

                const scalePop = e.hitFlash > 0 ? 1.08 : 1.0;
                if (e.type === 'emoji') {
                    ctx.font = e.hitFlash > 0 ? '60px Arial' : '52px Arial';
                    ctx.fillText(e.emoji, e.x, e.y);
                } else {
                    if (!e.dw) {
                        if (e.img && e.img.complete && e.img.naturalHeight !== 0) {
                            const ar = e.img.naturalWidth / e.img.naturalHeight;
                            e.dw = e.isBoss ? 120 : (e.isMiniBoss && e.bossType === 5 ? 36 : 54);
                            e.dh = e.dw / ar;
                        } else { e.dw = 0; e.dh = 0; }
                    }
                    if (e.dw > 0) {
                        const w = e.dw * scalePop, h = e.dh * scalePop;
                        ctx.drawImage(e.img, e.x - w / 2, e.y - h / 2, w, h);
                        if (e.hitFlash > 0) {
                            ctx.beginPath(); ctx.arc(e.x, e.y, Math.min(w, h) * 0.4, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill();
                        }
                    }
                }

                if (e.hp < e.maxHp && !e.hideHpBar && !e.isEntering && !e.isBoss) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; ctx.fillRect(e.x - 26, e.y - 40, 52, 5);
                    ctx.fillStyle = e.isCharger ? '#e74c3c' : '#2ecc71';
                    ctx.fillRect(e.x - 26, e.y - 40, 52 * Math.max(0, e.hp / e.maxHp), 5);
                }

                if (e.isBoss && e.invulTimer > 0 && e.bossType !== 7) {
                    ctx.save(); ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.28)'; ctx.fill();
                    ctx.strokeStyle = '#5dade2'; ctx.lineWidth = 5; ctx.setLineDash([10, 8]); ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 19px 微軟正黑體';
                    const statusText = e.bossType === 4 ? "跌停鎖死" : (e.bossType === 6 ? "領域展開" : "絕對防禦");
                    ctx.fillText(`${statusText}: ${Math.ceil(e.invulTimer / 60)}s`, e.x, e.y - e.size - 38);
                    ctx.restore();
                }
            };

            regularEnemies.forEach(renderEnemy);
            miniBossEnemies.forEach(renderEnemy);
            bossEnemies.forEach(renderEnemy);

            fxParticles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 玩家繪製
            if (player.hasCaffeineFever && player.caffeineStacks > 0 && isUIHidden <= 0) {
                const maxS = player.caffeineUpgraded ? 60 : 40;
                const intensity = player.caffeineStacks / maxS;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.collisionRadius + 14 + intensity * 26, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(241, 196, 15, ${0.1 + intensity * 0.2})`; ctx.fill();
            }

            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                const ar = playerImg.naturalWidth / playerImg.naturalHeight;
                const tw = 78, th = 78 / ar;
                if (player.invulTimer > 0 && frameCount % 8 < 4) ctx.globalAlpha = 0.45;
                ctx.drawImage(playerImg, player.x - tw / 2, player.y - th / 2, tw, th);
                ctx.globalAlpha = 1.0;
            } else {
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(player.x, player.y, player.collisionRadius, 0, Math.PI * 2); ctx.fill();
            }

            if (player.shield > 0) {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.collisionRadius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(46, 204, 113, 0.85)'; ctx.lineWidth = 3.5; ctx.stroke();
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`🛡️x${player.shield}`, player.x + player.collisionRadius + 16, player.y - player.collisionRadius);
            }

            if (player.hasCaffeineFever && player.caffeineStacks > 0 && isUIHidden <= 0) {
                const per = player.caffeineUpgraded ? 3.5 : 2.5;
                ctx.font = 'bold 14px 微軟正黑體'; ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(`🔥 ${player.caffeineStacks}層 (+${Math.round(player.caffeineStacks * per)}%)`, player.x + 1, player.y - 46);
                ctx.fillStyle = '#f1c40f'; ctx.fillText(`🔥 ${player.caffeineStacks}層 (+${Math.round(player.caffeineStacks * per)}%)`, player.x, player.y - 47);
            }

            // 撿球即時提示 Toast
            if (player.toastTimer > 0) {
                const ty = player.y - 68 - (110 - player.toastTimer) * 0.18;
                ctx.globalAlpha = Math.min(1, player.toastTimer / 25);
                ctx.font = 'bold 17px 微軟正黑體'; ctx.textAlign = 'center'; ctx.lineWidth = 4;
                ctx.strokeStyle = '#000'; ctx.strokeText(player.toastText, player.x, ty);
                ctx.fillStyle = player.toastColor; ctx.fillText(player.toastText, player.x, ty);
                ctx.globalAlpha = 1.0;
            } else if (player.shoutTimer > 0) {
                player.shoutTimer--;
                const fy = player.y - 68 - (140 - player.shoutTimer) * 0.12;
                ctx.font = 'bold 18px 微軟正黑體'; ctx.textAlign = 'center'; ctx.lineWidth = 4;
                ctx.strokeStyle = '#1b2631'; ctx.strokeText(player.shoutText, player.x, fy);
                ctx.fillStyle = '#f1c40f'; ctx.fillText(player.shoutText, player.x, fy);
            }

            // 傷害數字
            ctx.font = 'bold 19px Arial'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
            damageNumbers.forEach(d => {
                ctx.strokeText(d.text, d.x, d.y);
                ctx.fillStyle = d.color;
                ctx.fillText(d.text, d.x, d.y);
            });

            if (flashAlpha > 0.01) {
                ctx.fillStyle = flashColor; ctx.globalAlpha = flashAlpha;
                ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1.0;
            }

            // 動態搖桿光環
            if (joystick.active) {
                const dx = joystick.currentX - joystick.originX, dy = joystick.currentY - joystick.originY;
                const dist = Math.hypot(dx, dy);
                const clampedDist = Math.min(dist, joystick.maxDist);
                const angle = Math.atan2(dy, dx);
                const knobX = joystick.originX + Math.cos(angle) * clampedDist;
                const knobY = joystick.originY + Math.sin(angle) * clampedDist;

                ctx.beginPath(); ctx.arc(joystick.originX, joystick.originY, joystick.maxDist * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fill();
                ctx.strokeStyle = 'rgba(241, 196, 15, 0.45)'; ctx.lineWidth = 2; ctx.stroke();

                ctx.beginPath(); ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(241, 196, 15, 0.5)'; ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
            }

            ctx.restore();
            drawHUD(bossEnemies);
        }

        function drawHUD(bossEnemies) {
            // 1. 頂部經驗條
            const expRatio = level >= 100 ? 1 : Math.min(1, currentExp / expToNextLevel);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.fillRect(0, 0, canvas.width, 10);
            const expGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            expGrad.addColorStop(0, '#3498db'); expGrad.addColorStop(1, '#f1c40f');
            ctx.fillStyle = expGrad; ctx.fillRect(0, 0, canvas.width * expRatio, 10);

            if (isUIHidden > 0) {
                ctx.fillStyle = 'rgba(231, 76, 60, 0.86)'; ctx.fillRect(0, canvas.height / 2 - 64, canvas.width, 128);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 40px 微軟正黑體'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                const offset = (frameCount * 9) % (canvas.width + 1200);
                ctx.fillText("⚠️ BREAKING NEWS: FAKE NEWS! UI BLOCKED! GREAT WALL! ⚠️", canvas.width - offset, canvas.height / 2);
                return;
            }

            const isNarrow = canvas.width < 680;
            ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

            // 2. 左上角資訊
            ctx.font = 'bold 23px 微軟正黑體';
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(`LV. ${level}`, 15, 34);
            ctx.fillStyle = '#f1c40f'; ctx.fillText(`LV. ${level}`, 14, 32);

            ctx.font = 'bold 13px 微軟正黑體';
            ctx.fillStyle = '#bdc3c7';
            ctx.fillText(`擊殺 ${score} ｜ 吃球 ${orbsCollected} ｜ 火力 x${getTotalDamageMult().toFixed(2)}`, 14, 55);

            // 3. 頂部 Boss 血條
            const mainBoss = bossEnemies.find(b => !b.isEntering && !b.hideHpBar) || bossEnemies.find(b => !b.isEntering);
            if (mainBoss) {
                const bw = Math.min(430, canvas.width - 170);
                const bh = 16;
                const bx = (canvas.width - bw) / 2;
                const by = 48;
                const bRatio = Math.max(0, mainBoss.hp / mainBoss.maxHp);

                ctx.font = 'bold 14px 微軟正黑體'; ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(BOSS_NAMES[mainBoss.bossType] || 'BOSS', canvas.width / 2 + 1, by - 13);
                ctx.fillStyle = '#f1c40f'; ctx.fillText(BOSS_NAMES[mainBoss.bossType] || 'BOSS', canvas.width / 2, by - 14);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.72)'; ctx.fillRect(bx, by, bw, bh);
                ctx.fillStyle = mainBoss.invulTimer > 0 ? '#5dade2' : '#e74c3c';
                ctx.fillRect(bx + 2, by + 2, (bw - 4) * bRatio, bh - 4);
                if (mainBoss.bossType !== 7) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillRect(bx + bw / 2 - 1, by, 2, bh);
                }
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
                if (mainBoss.hideHpBar) {
                    ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#fff'; ctx.fillText('??? (隱藏魔力)', canvas.width / 2, by + bh / 2);
                }
            }

            // 4. 關稅壁壘提示
            if (tariffUnlocked) {
                const bannerY = mainBoss ? 76 : 24;
                ctx.fillStyle = isTariffActive ? 'rgba(192, 57, 43, 0.78)' : 'rgba(46, 204, 113, 0.55)';
                ctx.fillRect(canvas.width / 2 - 200, bannerY, 400, 24);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px 微軟正黑體'; ctx.textAlign = 'center';
                const secLeft = Math.ceil(tariffCycleTimer / 60);
                ctx.fillText(isTariffActive ? `⚠️ 關稅壁壘生效中：冷卻延長 / 移速下降 (${secLeft}s)` : `✅ 關稅暫緩期：快搶強化球！(${secLeft}s)`, canvas.width / 2, bannerY + 12);
            }

            // 5. 黃金拉花球狀態提示 (右上角按鈕下方)
            if (ultimateUnlocked) {
                const hasUlt = powerOrbs.some(o => o.type === 'ultimate');
                ctx.textAlign = 'right';
                ctx.font = 'bold 13px 微軟正黑體';
                if (hasUlt) {
                    ctx.fillStyle = frameCount % 30 < 15 ? '#ffd700' : '#ffffff';
                    ctx.fillText('🌟 黃金拉花球已掉落！快踩！', canvas.width - 14, 68);
                } else {
                    ctx.fillStyle = '#f3c677';
                    ctx.fillText(`🌟 下顆拉花球：${Math.ceil(ultOrbTimer / 60)}s`, canvas.width - 14, 68);
                }
            }

            // 6. 左下角：4 武器等級徽章 + 通用參數狀態
            const wKeys = ['americano', 'latte', 'coldBrew', 'aeropress'];
            const slotW = isNarrow ? 56 : 74;
            const slotH = 26;
            const baseY = isNarrow ? canvas.height - 64 : canvas.height - 38;
            wKeys.forEach((k, idx) => {
                const w = weapons[k];
                const sx = 12 + idx * (slotW + 6);
                ctx.fillStyle = w.level > 0 ? 'rgba(20, 30, 42, 0.82)' : 'rgba(20, 30, 42, 0.4)';
                ctx.fillRect(sx, baseY, slotW, slotH);
                ctx.strokeStyle = w.level > 0 ? w.color : 'rgba(255,255,255,0.2)';
                ctx.lineWidth = w.level >= 5 ? 2.5 : 1.5;
                ctx.strokeRect(sx, baseY, slotW, slotH);

                ctx.textAlign = 'center';
                ctx.font = isNarrow ? 'bold 11px 微軟正黑體' : 'bold 12px 微軟正黑體';
                ctx.fillStyle = w.level > 0 ? '#ffffff' : '#7f8c8d';
                const label = w.level > 0 ? `${w.icon}${w.short}${w.level}` : `${w.icon}--`;
                ctx.fillText(label, sx + slotW / 2, baseY + slotH / 2 + 1);
            });

            ctx.textAlign = 'left';
            ctx.font = 'bold 12px 微軟正黑體';
            ctx.fillStyle = '#d5dbdb';
            ctx.fillText(`✨+${player.extraProjectiles}  ⚡Lv.${player.hasteStacks}  🔥Lv.${player.powerStacks}  ❄️Lv.${player.flavorStacks}`, 14, baseY - 12);

            // 7. 右下角：血條、時間、復活
            const hw = isNarrow ? Math.min(200, canvas.width - 40) : 250;
            const hh = 22;
            const hx = canvas.width - hw - 14;
            const hy = canvas.height - 34;

            const totalSecs = Math.floor(frameCount / 60);
            const m = String(Math.floor(totalSecs / 60)).padStart(2, '0');
            const s = String(totalSecs % 60).padStart(2, '0');
            ctx.font = 'bold 14px 微軟正黑體'; ctx.textAlign = 'right';
            ctx.fillStyle = '#ecf0f1'; ctx.fillText(`⏱️ ${m}:${s}`, hx + hw, hy - 12);

            if (player.revives > 0) {
                ctx.textAlign = 'left'; ctx.fillStyle = '#f1c40f';
                ctx.fillText(`👼 x${player.revives}`, hx, hy - 12);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(hx, hy, hw, hh);
            const hr = Math.max(0, player.hp / player.maxHp);
            ctx.fillStyle = hr > 0.3 ? '#e74c3c' : '#c0392b';
            ctx.fillRect(hx + 2, hy + 2, (hw - 4) * hr, hh - 4);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(hx, hy, hw, hh);
            ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
            ctx.fillText(`${Math.ceil(player.hp)} / ${player.maxHp}`, hx + hw / 2, hy + hh / 2 + 1);

            if (isPaused && !isInfoMenu && player.hp > 0 && !hasWon) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 50px 微軟正黑體'; ctx.textAlign = 'center';
                ctx.fillText("營業暫停", canvas.width / 2, canvas.height / 2 - 18);
                ctx.fillStyle = '#ecf0f1'; ctx.font = '19px 微軟正黑體';
                ctx.fillText("按下 [P] 鍵或點擊右上「繼續」恢復營業", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        // === 11. Firebase 雲端排行榜 ===
        const firebaseConfig = {
            apiKey: "AIzaSyA5fSYk3HikkNzCPafnzwG9xhgijuXJI9g",
            authDomain: "coca-survivor.firebaseapp.com",
            databaseURL: "https://coca-survivor-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "coca-survivor",
            storageBucket: "coca-survivor.firebasestorage.app",
            messagingSenderId: "222225908258",
            appId: "1:222225908258:web:810c1f2f967347494c807b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let finalCalculatedScore = 0;
        let finalSurvivalTimeStr = "";

        function triggerEndScreen(isVictory) {
            if (endScreenTriggered) return;
            endScreenTriggered = true;
            isPaused = true;
            joystick.active = false;

            const totalSecs = Math.floor(frameCount / 60);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            finalSurvivalTimeStr = `${mins}分${secs}秒`;

            const hpBonus = isVictory ? Math.floor(player.hp) * (1 + player.revives) : 0;
            const timeBonus = isVictory ? Math.max(0, 1200 - totalSecs) * 5 : totalSecs * 10;
            finalCalculatedScore = score + orbsCollected * 15 + hpBonus + timeBonus;

            const winTitle = document.querySelector('#winScreen h1');
            winTitle.innerText = isVictory ? "🏆 恭喜破關！" : "☕ 當日營業結束";
            winTitle.style.color = isVictory ? "#f1c40f" : "#e74c3c";

            const flavor = isVictory
                ? "萃比靠著風騷走位撐過了 TRUMP 的考驗，守護了竹北的咖啡因！"
                : `萃比在 LV.${level} 被缺乏咖啡因的喪屍淹沒了...`;

            document.getElementById('winStats').innerHTML = `${flavor}<br><br>存活時間：${finalSurvivalTimeStr}<br>等級：LV.${level} ｜ 擊殺：${score} ｜ 吃球：${orbsCollected}`;
            document.getElementById('winScoreText').innerText = `最終總分：${finalCalculatedScore}`;
            document.getElementById('winScreen').style.display = 'flex';
        }

        document.getElementById('btnSubmitScore').addEventListener('click', () => {
            let name = document.getElementById('playerName').value.trim();
            if (!name) name = "無名萃粉";

            const scoreData = {
                name,
                score: finalCalculatedScore,
                survivalTime: finalSurvivalTimeStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            const btn = document.getElementById('btnSubmitScore');
            btn.disabled = true;
            btn.innerText = "上傳中...";

            database.ref('leaderboard').push(scoreData).then(() => {
                fetchAndShowLeaderboard(name, finalCalculatedScore);
            }).catch(() => {
                alert("上傳失敗，請檢查網路連線！");
                btn.disabled = false;
                btn.innerText = "送出成績";
            });
        });

        function fetchAndShowLeaderboard(playerName, playerScore) {
            document.getElementById('winScreen').style.display = 'none';
            database.ref('leaderboard').orderByChild('score').limitToLast(10).once('value', (snapshot) => {
                const lb = [];
                snapshot.forEach(child => { lb.push(child.val()); });
                lb.reverse();

                let html = "";
                let playerRank = -1;
                for (let i = 0; i < lb.length; i++) {
                    const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `<span style="display:inline-block;width:24px;text-align:center;">${i + 1}.</span>`;
                    const isMe = (lb[i].name === playerName && lb[i].score === playerScore);
                    const meStyle = isMe ? "color:#f1c40f; font-weight:bold;" : "";
                    const sTime = lb[i].survivalTime || "未知";

                    let realDateStr = "";
                    if (lb[i].timestamp) {
                        const d = new Date(lb[i].timestamp);
                        realDateStr = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                    }

                    html += `<div style="${meStyle}; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding:8px 0;">
                                <div style="display:flex; flex-direction:column;">
                                    <span style="font-size:17px;">${medal} ${lb[i].name}</span>
                                    <span style="font-size:12px; color:#95a5a6; margin-left:28px; margin-top:3px;">🎮 ${sTime}${realDateStr ? ' | 📅 ' + realDateStr : ''}</span>
                                </div>
                                <span style="font-size:19px;">${lb[i].score} 分</span>
                             </div>`;
                    if (isMe && playerRank === -1) playerRank = i + 1;
                }

                document.getElementById('leaderboardList').innerHTML = html || "目前尚無紀錄";
                document.getElementById('playerRankDisplay').innerText = playerRank === -1
                    ? `你的分數：${playerScore} 分 (未進入前 10 名)`
                    : `🎉 恭喜名列前茅！(第 ${playerRank} 名)`;
                document.getElementById('leaderboardScreen').style.display = 'flex';
            });
        }

        // === 12. 固定時間步長遊戲主迴圈 (60FPS 邏輯基準) ===
        const FIXED_STEP = 1000 / 60;
        let lastTime = performance.now();
        let accumulator = 0;

        function gameLoop(now) {
            const elapsed = Math.min(now - lastTime, 100);
            lastTime = now;

            if (player.hp <= 0 && !endScreenTriggered) {
                triggerEndScreen(false);
            } else if (!isPaused && !hasWon && !endScreenTriggered) {
                accumulator += elapsed;
                while (accumulator >= FIXED_STEP) {
                    update();
                    accumulator -= FIXED_STEP;
                    if (isPaused || hasWon || player.hp <= 0) {
                        accumulator = 0;
                        break;
                    }
                }
            } else {
                accumulator = 0;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
